name: Extract IPA bundle identifiers

on:
  push:
    branches: [main]
    paths:
      - "scripts/extract_bundle_ids.py"
      - ".github/workflows/extract-bundle-ids.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Extract bundle identifiers and versions
        run: python scripts/extract_bundle_ids.py
      - name: Commit metadata report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metadata/bundle-identifiers.json
          git commit -m "Record verified IPA bundle identifiers"
          git push
