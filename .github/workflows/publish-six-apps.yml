name: فحص ونشر تطبيقات AMARYT الستة

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/publish-six-apps.yml"

permissions:
  contents: write

concurrency:
  group: amaryt-publish-six-apps
  cancel-in-progress: false

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: جلب المستودع
        uses: actions/checkout@v4

      - name: فحص ملفات IPA واستخراج بياناتها ثم تحديث الكتالوج
        run: |
          python3 <<'PY'
          import json, os, plistlib, re, tempfile, urllib.request, zipfile
          from datetime import datetime, timezone
          from pathlib import PurePosixPath
          from pathlib import Path

          owner_repo = "Amaryt1/Mstoda"
          release = "1.0"
          apps = [
            {
              "name": "iQFace", "file": "iQFace_1.2.ipa", "version": "1.2",
              "icon": "Meta_AI_iQFace_1.2_Facebook_20261117_003919.png",
              "banner": "iQFace%20Banner.jpg", "category": "تواصل اجتماعي",
              "subtitle": "ميزات إضافية وتجربة محسّنة لفيسبوك",
              "description": "للوصول إلى إعدادات iQFace: اضغط على شعار فيسبوك في الزاوية العلوية اليسرى أو شعار iQ. للوصول إلى إعدادات Facebook Plus: اضغط مع الاستمرار على أيقونة شريط الصفحة الرئيسية، أو اضغط مع الاستمرار على شعار فيسبوك في الأعلى. يتضمن وضع OLED، وأيقونات Facebook Plus، وأداة تنظيف الذاكرة المؤقتة، ومرشحات الصفحة الرئيسية، وإضافة Safari لـ OpenInFacebook."
            },
            {
              "name": "iQGram", "file": "iQGram_1.3.ipa", "version": "1.3",
              "icon": "Meta_AI_iQGram_1.3_20261117_003912.png",
              "banner": "iQGram%20Banner.webp", "category": "تواصل اجتماعي",
              "subtitle": "وضع الشبح وميزات إضافية للرسائل والوسائط",
              "description": "وضع الشبح (رسائل - قصص - بثوث). إبقاء الرسائل المحذوفة. تسجيل المكالمات (فيديو - صوت). رفع الفويس من الملفات أو الاستديو أو YouTube. تنزيل الوسائط المؤقتة. التنزيل المحسن (كل الجودات). إمكانية نسخ (يوزر-كابشن-بايو-اسم). دعم كامل للغة العربية (إعدادات الجهاز > تطبيقات > iQGram > اللغات واختر العربية)."
            },
            {
              "name": "iQSwift", "file": "iQSwift_1.5.ipa", "version": "1.5",
              "icon": "Meta_AI_iQSwift_1.5_20261117_003915.png",
              "banner": "iQSwift%20Banner.webp", "category": "تواصل اجتماعي",
              "subtitle": "وضع الشبح وأدوات إضافية للرسائل والمكالمات",
              "description": "وضع الشبح (رسائل - قصص). إبقاء الرسائل المحذوفة. تسجيل المكالمات (فيديو - صوت). رفع الفويس من الملفات أو الاستديو أو YouTube. تنزيل الوسائط المؤقتة. ترجمة الرسائل. سجل تعديل الرسائل. النسخ تدعم الإشعارات بشرط عدم التكرار (تغيير البندل)."
            },
            {
              "name": "iQTele", "file": "iQTele_1.5.ipa", "version": "1.5",
              "icon": "Meta_AI_iQTele_1.5_20261117_003917.png",
              "banner": "iQTele%20Banner.webp", "category": "تواصل اجتماعي",
              "subtitle": "وضع الشبح وأدوات متقدمة للمحادثات",
              "description": "وضع الشبح (رسائل - قصص). إبقاء الرسائل المحذوفة. تسجيل المكالمات (فيديو - صوت). رفع الفويس من الملفات أو الاستديو أو YouTube. تنزيل الوسائط المؤقتة. ترجمة الرسائل. سجل تعديل الرسائل. النسخ تدعم الإشعارات بشرط عدم التكرار (تغيير البندل)."
            },
            {
              "name": "iQTube", "file": "iQTube_1.3.ipa", "version": "1.3",
              "icon": "Meta_AI_iQTube_1.3_20261117_003922.png",
              "banner": "iQTube%20Banner.webp", "category": "فيديو",
              "subtitle": "تحميل الفيديو والصوت وتشغيل بالخلفية",
              "description": "تحميل فيديو/شورتس/صوت بجودات عالية ومتنوعة. حفظ الصور المصغرة. تشغيل الفيديو بالخلفية (PiP). حذف الإعلانات بالكامل من التطبيق، مع المنع الذكي. تسجيل الدخول يعمل بالنسخ الأصلية والمكررة. النسخ الاحتياطي. والمزيد داخل إعدادات الأداة."
            },
            {
              "name": "iQTv", "file": "iQTv.ipa", "version": "1.1",
              "icon": "Meta_AI_iQTv_20261117_003926.png",
              "banner": "iQTv%20Banner.webp", "category": "أفلام",
              "subtitle": "مشاهدة الأفلام والمسلسلات والبث المباشر",
              "description": "تطبيق لمشاهدة الأفلام والمسلسلات والبث المباشر. يحتوي على سيرفرات متعددة تعمل مع جميع أنواع الإنترنت. يمكن تغيير السيرفر من إعدادات التطبيق."
            }
          ]

          base = f"https://github.com/{owner_repo}/releases/download/{release}/"
          raw = f"https://raw.githubusercontent.com/{owner_repo}/main/source-images/aa/"
          verified = []
          for app in apps:
              url = base + app["file"]
              req = urllib.request.Request(url, headers={"User-Agent":"AMARYT-STORE-IPA-Validator/1.0"})
              with urllib.request.urlopen(req, timeout=120) as response, tempfile.NamedTemporaryFile(suffix=".ipa") as tmp:
                  if response.status != 200:
                      raise SystemExit(f"{app['name']}: HTTP {response.status}")
                  total = 0
                  while True:
                      chunk = response.read(1024 * 1024)
                      if not chunk: break
                      tmp.write(chunk); total += len(chunk)
                  tmp.flush()
                  if not zipfile.is_zipfile(tmp.name):
                      raise SystemExit(f"{app['name']}: الملف ليس IPA/ZIP صالحاً")
                  with zipfile.ZipFile(tmp.name) as z:
                      bad = z.testzip()
                      if bad: raise SystemExit(f"{app['name']}: ملف تالف داخل IPA: {bad}")
                      plist_paths = [n for n in z.namelist() if re.fullmatch(r"Payload/[^/]+\.app/Info\.plist", n)]
                      if len(plist_paths) != 1:
                          raise SystemExit(f"{app['name']}: لم يتم العثور على Info.plist واحد واضح داخل Payload")
                      info = plistlib.loads(z.read(plist_paths[0]))
                      bundle = info.get("CFBundleIdentifier")
                      actual_version = str(info.get("CFBundleShortVersionString") or info.get("CFBundleVersion") or "")
                      if not bundle:
                          raise SystemExit(f"{app['name']}: Bundle Identifier مفقود")
                      if actual_version != app["version"]:
                          raise SystemExit(f"{app['name']}: الإصدار داخل IPA هو {actual_version!r} بينما الإصدار المعتمد {app['version']!r}. لم يتم تحديث apps.json.")
                      if any(x["bundleIdentifier"] == bundle for x in verified):
                          raise SystemExit(f"Bundle Identifier مكرر: {bundle}")
                      app["bundleIdentifier"] = bundle
                      app["downloadURL"] = url
                      app["iconURL"] = raw + app["icon"]
                      app["bannerURL"] = raw + app["banner"]
                      app["sizeBytes"] = total
                      verified.append(app)
                      print(f"OK {app['name']}: {bundle} | {actual_version} | {total:,} bytes")

          catalog_path = Path("apps.json")
          catalog = json.loads(catalog_path.read_text(encoding="utf-8"))
          if not isinstance(catalog.get("apps"), list):
              raise SystemExit("apps.json غير صالح: apps ليست قائمة")
          existing_ids = {x.get("bundleIdentifier") for x in catalog["apps"]}
          for app in verified:
              if app["bundleIdentifier"] in existing_ids:
                  raise SystemExit(f"{app['name']}: Bundle ID موجود مسبقاً؛ أوقفت النشر حتى لا أكرر أو أستبدل تطبيقاً موجوداً.")
          date = datetime.now(timezone.utc).isoformat(timespec="seconds").replace("+00:00","Z")
          start_order = max([int(x.get("sortOrder", 0)) for x in catalog["apps"]] + [0]) + 1
          for offset, app in enumerate(verified):
              entry = {
                "bundleIdentifier": app["bundleIdentifier"],
                "versions": [{
                  "version": app["version"], "date": date,
                  "downloadURL": app["downloadURL"],
                  "localizedDescription": app["subtitle"]
                }],
                "screenshotURLs": [],
                "name": app["name"],
                "subtitle": app["subtitle"],
                "category": app["category"],
                "localizedDescription": app["description"],
                "iconURL": app["iconURL"],
                "bannerURL": app["bannerURL"],
                "tintColor": "#4299E1",
                "sortOrder": start_order + offset
              }
              catalog["apps"].append(entry)

          catalog_path.write_text(json.dumps(catalog, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          report = {
            "release": release,
            "verifiedAt": date,
            "verifiedApps": [{
              "name": a["name"], "bundleIdentifier": a["bundleIdentifier"],
              "version": a["version"], "sizeBytes": a["sizeBytes"],
              "iconURL": a["iconURL"], "bannerURL": a["bannerURL"],
              "downloadURL": a["downloadURL"]
            } for a in verified]
          }
          Path("app-verification.json").write_text(json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print("تم التحقق من التطبيقات الستة، وإضافة سجلاتها دون المساس بالتطبيقات الموجودة.")
          PY

      - name: حفظ الكتالوج وتقرير الفحص
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps.json app-verification.json
          git commit -m "Add six verified iQ apps to AMARYT STORE"
          git push
