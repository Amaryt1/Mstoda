name: تجهيز أيقونات وبنرات التطبيقات

on:
  workflow_dispatch:
  push:
    paths:
      - "source-images/icons.jpg"
      - ".github/workflows/extract-app-artwork.yml"

permissions:
  contents: write

concurrency:
  group: amaryt-app-artwork
  cancel-in-progress: false

jobs:
  artwork:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: جلب المستودع
        uses: actions/checkout@v4

      - name: إعداد أدوات قراءة الصورة
        run: |
          brew install tesseract
          python3 -m pip install --user Pillow pytesseract

      - name: قص الأيقونات وإنشاء البنرات من الصورة المرفوعة
        run: |
          python3 <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont, ImageFilter
          import pytesseract, re, json

          source = Path("source-images/icons.jpg")
          if not source.exists():
              raise SystemExit("لم يتم العثور على source-images/icons.jpg")
          im = Image.open(source).convert("RGB")
          W, H = im.size
          data = pytesseract.image_to_data(im, output_type=pytesseract.Output.DICT, config="--psm 11")
          targets = ["iQFace", "iQGram", "iQSwift", "iQTele", "iQTube", "iQTv"]
          normalized = lambda s: re.sub(r"[^a-z0-9]", "", s.lower())
          tokens = []
          for i, raw in enumerate(data["text"]):
              t = normalized(raw)
              if t:
                  tokens.append((t, i))
          out_icons = Path("preview-assets/icons")
          out_banners = Path("preview-assets/banners")
          out_icons.mkdir(parents=True, exist_ok=True)
          out_banners.mkdir(parents=True, exist_ok=True)
          report = {"source": str(source), "imageSize": [W, H], "apps": []}

          def font(size):
              for p in ["/System/Library/Fonts/Supplemental/Arial Bold.ttf",
                        "/System/Library/Fonts/Supplemental/Arial.ttf"]:
                  if Path(p).exists():
                      return ImageFont.truetype(p, size)
              return ImageFont.load_default()

          for app in targets:
              key = normalized(app)
              matches = [i for t, i in tokens if key in t or t in key]
              if not matches:
                  # Also allow OCR to split an app label into adjacent words.
                  for pos, (t, i) in enumerate(tokens):
                      joined = t
                      ids = [i]
                      for t2, i2 in tokens[pos+1:pos+3]:
                          joined += t2
                          ids.append(i2)
                          if key in joined:
                              matches.extend(ids)
                              break
              if not matches:
                  raise SystemExit(f"لم أتعرف على اسم {app} داخل الصورة؛ أوقفت العملية حتى لا أقص أيقونة خاطئة.")
              i = matches[0]
              x, y = data["left"][i], data["top"][i]
              tw, th = data["width"][i], data["height"][i]
              # في قائمة التطبيقات تكون الأيقونة عادةً إلى يسار اسم التطبيق.
              side = max(int(th * 3.0), int(tw * 1.25), 96)
              cy = y + th // 2
              cx = x - side * 0.78
              left = max(0, min(W-side, int(cx-side/2)))
              top = max(0, min(H-side, int(cy-side/2)))
              crop = im.crop((left, top, left+side, top+side))
              # إذا كان موضع اليسار خارج الصورة، جرّب الجهة المقابلة.
              if x < side * 0.8:
                  left = max(0, min(W-side, int(x+tw+th*0.3)))
                  crop = im.crop((left, top, left+side, top+side))
              icon_path = out_icons / f"{app}.png"
              crop.save(icon_path, "PNG", optimize=True)

              swatch = crop.resize((1,1)).getpixel((0,0))
              bw, bh = 1200, 600
              bg = Image.new("RGB", (bw,bh), (13,16,27))
              glow = Image.new("RGB", (bw,bh), swatch).filter(ImageFilter.GaussianBlur(150))
              bg = Image.blend(bg, glow, 0.22)
              banner = bg.convert("RGBA")
              icon = crop.resize((300,300), Image.Resampling.LANCZOS).convert("RGBA")
              banner.alpha_composite(icon, (125,150))
              d = ImageDraw.Draw(banner)
              d.text((500,235), app, font=font(76), fill="white", stroke_width=2, stroke_fill=(0,0,0,130))
              d.text((505,340), "AMARYT STORE", font=font(30), fill=(220,225,238,255))
              banner.convert("RGB").save(out_banners/f"{app}.png", "PNG", optimize=True)
              report["apps"].append({"name":app,"icon":str(icon_path),"banner":str(out_banners/f"{app}.png"),"ocrBox":{"x":x,"y":y,"width":tw,"height":th}})
              print(f"Prepared {app}: OCR label at {x},{y}")

          Path("preview-assets/metadata.json").write_text(json.dumps(report,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          rows = ["# AMARYT STORE — معاينة الأيقونات والبنرات", "",
                  "هذه معاينة مبنية من الصورة source-images/icons.jpg فقط. لم يتم تعديل apps.json.", "",
                  "| التطبيق | الأيقونة | البنر |","|---|---|---|"]
          for app in targets:
              rows.append(f"| {app} | [عرض الأيقونة](icons/{app}.png) | [عرض البنر](banners/{app}.png) |")
          Path("preview-assets/README.md").write_text("\n".join(rows)+"\n",encoding="utf-8")
          PY

      - name: حفظ ملفات المعاينة فقط
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview-assets/
          if git diff --cached --quiet; then
            echo "لا توجد ملفات جديدة لحفظها."
            exit 0
          fi
          git commit -m "Prepare app icon crops and preview banners"
          git push
