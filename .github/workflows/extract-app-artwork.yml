name: تجهيز أيقونات وبنرات التطبيقات

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/extract-app-artwork.yml"

permissions:
  contents: write

concurrency:
  group: amaryt-app-artwork
  cancel-in-progress: false

jobs:
  artwork:
    runs-on: macos-latest
    timeout-minutes: 360
    steps:
      - name: جلب المستودع
        uses: actions/checkout@v4

      - name: إعداد Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: إعداد أدوات استخراج الصور
        run: |
          go install github.com/devcxm/carfile-go/cmd/carfile@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          python -m pip install Pillow

      - name: تنزيل واستخراج الأيقونات الأصلية وإنشاء البنرات
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/ipas work/unpacked preview-assets/icons preview-assets/banners
          declare -A files=(
            [iQFace]="iQFace_1.2.ipa"
            [iQGram]="iQGram_1.3.ipa"
            [iQSwift]="iQSwift_1.5.ipa"
            [iQTele]="iQTele_1.5.ipa"
            [iQTube]="iQTube_1.3.ipa"
            [iQTv]="iQTv.ipa"
          )
          for app in iQFace iQGram iQSwift iQTele iQTube iQTv; do
            file="${files[$app]}"
            url="https://github.com/Amaryt1/Mstoda/releases/download/1.0/$file"
            echo "Downloading $file"
            curl --fail --location --retry 4 --retry-delay 3 "$url" -o "work/ipas/$file"
            mkdir -p "work/unpacked/$app"
            ditto -x -k "work/ipas/$file" "work/unpacked/$app"
          done

          python3 <<'PY'
          import json, plistlib, shutil, subprocess, sys
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFilter, ImageFont

          root = Path("work/unpacked")
          out_icons = Path("preview-assets/icons")
          out_banners = Path("preview-assets/banners")
          apps = ["iQFace", "iQGram", "iQSwift", "iQTele", "iQTube", "iQTv"]
          report = {"release": "1.0", "apps": []}

          def square_pngs(folder):
              found = []
              for p in folder.rglob("*.png"):
                  try:
                      with Image.open(p) as im:
                          w, h = im.size
                          if w == h and w >= 120:
                              found.append((w*h, p))
                  except Exception:
                      pass
              return found

          def load_font(size, bold=False):
              candidates = [
                  "/System/Library/Fonts/Supplemental/Arial Bold.ttf" if bold else "/System/Library/Fonts/Supplemental/Arial.ttf",
                  "/System/Library/Fonts/SFNS.ttf"
              ]
              for f in candidates:
                  if Path(f).exists():
                      return ImageFont.truetype(f, size)
              return ImageFont.load_default()

          for app in apps:
              app_dirs = list((root/app/"Payload").glob("*.app"))
              if len(app_dirs) != 1:
                  raise SystemExit(f"{app}: expected one app bundle, found {len(app_dirs)}")
              bundle = app_dirs[0]
              info = plistlib.loads((bundle/"Info.plist").read_bytes())
              icon_names = []
              icons = info.get("CFBundleIcons", {}).get("CFBundlePrimaryIcon", {})
              icon_names += icons.get("CFBundleIconFiles", [])
              if icons.get("CFBundleIconName"):
                  icon_names.append(icons["CFBundleIconName"])
              if info.get("CFBundleIconFiles"):
                  icon_names += info["CFBundleIconFiles"]
              icon_names = [str(x).lower() for x in icon_names if x]

              candidates = []
              # First preference: original loose icon files explicitly named in Info.plist.
              for p in bundle.rglob("*"):
                  if p.is_file() and p.suffix.lower() == ".png":
                      stem = p.stem.lower()
                      if any(n in stem or stem in n for n in icon_names):
                          try:
                              with Image.open(p) as im:
                                  if im.width == im.height and im.width >= 120:
                                      candidates.append((im.width*im.height, p))
                          except Exception:
                              pass

              # Also extract the compiled catalog, preserving the app's own icon artwork.
              car = bundle/"Assets.car"
              if car.exists():
                  extracted = Path("work")/f"car-{app}"
                  extracted.mkdir(parents=True, exist_ok=True)
                  subprocess.run(["carfile", "-o", str(extracted), str(car)], check=True)
                  for area, p in square_pngs(extracted):
                      label = str(p.relative_to(extracted)).lower()
                      if any(n in label for n in icon_names) or "appicon" in label or "app-icon" in label:
                          candidates.append((area, p))

              if not candidates:
                  raise SystemExit(f"{app}: couldn't confidently identify the official app icon; no substitute was used.")
              candidates.sort(key=lambda item: item[0], reverse=True)
              source = candidates[0][1]
              icon_path = out_icons/f"{app}.png"
              shutil.copyfile(source, icon_path)

              with Image.open(icon_path) as opened:
                  icon = opened.convert("RGBA")
                  if icon.width != icon.height:
                      raise SystemExit(f"{app}: extracted icon is not square.")
                  swatch = icon.resize((1, 1)).getpixel((0, 0))[:3]
              W, H = 1200, 600
              base = Image.new("RGB", (W, H), (12, 15, 24))
              px = base.load()
              for y in range(H):
                  for x in range(W):
                      dx, dy = (x-330)/520, (y-290)/390
                      glow = max(0, 1-(dx*dx+dy*dy))**2 * 0.58
                      edge = (x/W)*0.12
                      px[x,y] = tuple(int(min(255, (12,15,24)[i] + swatch[i]*(glow+edge))) for i in range(3))
              base = base.filter(ImageFilter.GaussianBlur(1.2))
              canvas = base.convert("RGBA")
              # Original icon artwork is only scaled for placement; the source icon file remains untouched.
              icon.thumbnail((330, 330), Image.Resampling.LANCZOS)
              canvas.alpha_composite(icon, (115+(330-icon.width)//2, 135+(330-icon.height)//2))
              draw = ImageDraw.Draw(canvas)
              font = load_font(76, True)
              small = load_font(28, False)
              draw.text((520, 235), app, font=font, fill=(255,255,255,255), stroke_width=1, stroke_fill=(0,0,0,110))
              draw.text((525, 335), "AMARYT STORE", font=small, fill=(220,225,238,220))
              banner_path = out_banners/f"{app}.png"
              canvas.convert("RGB").save(banner_path, "PNG", optimize=True)

              report["apps"].append({
                  "name": app,
                  "bundleIdentifier": info.get("CFBundleIdentifier", ""),
                  "version": info.get("CFBundleShortVersionString", info.get("CFBundleVersion", "")),
                  "icon": str(icon_path),
                  "banner": str(banner_path),
                  "iconSource": str(source)
              })
              print(f"Prepared {app}: {report['apps'][-1]['bundleIdentifier']} {report['apps'][-1]['version']}")

          Path("preview-assets/metadata.json").write_text(json.dumps(report, ensure_ascii=False, indent=2)+"\n", encoding="utf-8")
          readme = [
              "# AMARYT STORE — معاينة الأيقونات والبنرات",
              "",
              "هذه ملفات معاينة فقط. لم يتم تعديل apps.json.",
              "",
              "| التطبيق | الأيقونة الأصلية | البنر |",
              "|---|---|---|",
          ]
          for app in apps:
              readme.append(f"| {app} | [PNG](icons/{app}.png) | [PNG](banners/{app}.png) |")
          Path("preview-assets/README.md").write_text("\n".join(readme)+"\n", encoding="utf-8")
          PY

      - name: حفظ ملفات المعاينة فقط
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview-assets/
          if git diff --cached --quiet; then
            echo "لا توجد ملفات جديدة لحفظها."
            exit 0
          fi
          git commit -m "Prepare original app icons and preview banners"
          git push
