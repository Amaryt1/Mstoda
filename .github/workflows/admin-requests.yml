name: AMARYT Admin | Stage owner request

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  stage:
    # A public Pages site can be viewed by anyone, but only a GitHub-authenticated
    # repository owner is allowed to request a change.
    if: >-
      github.repository == 'Amaryt1/Mstoda' &&
      github.event.issue.user.id == 190318829 &&
      !github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Mark the request as pending second GitHub confirmation
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" --body \
            "🔐 استلمنا طلب AMARYT Admin، **ولم نُعدّل أي تطبيق بعد**. لإتمامه من حسابك على GitHub: افتح [تأكيد تعديل التطبيقات](https://github.com/Amaryt1/Mstoda/actions/workflows/admin-confirm.yml) ثم اختر Run workflow وأدخل رقم هذا الطلب ($ISSUE_NUMBER). لا يحتاج النظام إلى إيميل أو Cloudflare. سيتم التنفيذ فقط إذا بدأ التأكيد مالك الحساب نفسه."
