name: Brand AMARYT banners

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/brand-banners.yml"
      - "scripts/brand_banners.py"
      - "source-images/aa/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  brand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image tools
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Create branded banners
        run: python scripts/brand_banners.py
      - name: Commit branded banners
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add branded-banners/
          if git diff --cached --quiet; then
            echo "No banner changes to commit."
          else
            git commit -m "Add AMARYT @LLYDL branded banners"
            git push
          fi
